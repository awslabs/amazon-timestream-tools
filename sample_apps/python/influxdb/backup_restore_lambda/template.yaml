AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Infrastructure for Timestream for InfluxDB backup and restore using ECS'

Parameters:
  BackupUrl:
    Type: String
    Description: The full URL of the Timestream for InfluxDB instance to backup from

  TokensSecretName:
    Type: String
    Description: Name of the AWS Secrets Manager secret containing both backup and restore tokens
    Default: "influxdb-backup-restore-secret"

  BackupOrg:
    Type: String
    Description: Organization that the bucket resides in for backup

  BackupPort:
    Type: Number
    Description: The port that the backup instance listens on. Defaults to 8086
    Default: 8086

  RestoreUrl:
    Type: String
    Description: The full URL of the Timestream for InfluxDB instance to restore to

  RestoreOrg:
    Type: String
    Description: Organization that the restored bucket will reside in

  RestorePort:
    Type: Number
    Description: The port that the restore instance listens on. Defaults to 8086
    Default: 8086

  BucketName:
    Type: String
    Description: Name of the Timestream for InfluxDB bucket to backup and restore

  S3BackupBucketName:
    Type: String
    Description: Name of the S3 bucket to store backup data in
    Default: influxdb-backup-data

  BackupSchedule:
    Type: String
    Description: Schedule expression for backup (default is every 7 days)
    Default: "cron(0 12 ? * 5 *)"

  RestoreSchedule:
    Type: String
    Description: Schedule expression for restore (default is every 7 days)
    Default: "cron(0 12 ? * 1 *)"

  ECRRepositoryName:
    Type: String
    Description: The name of the ECR repository used to hold the ECS task image
    Default: influxdb-backup-restore

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-igw"

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-subnet-1"

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-subnet-2"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-route-table"

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  BackupS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref S3BackupBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldBackups
            Status: Enabled
            ExpirationInDays: 365

  EFSFileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: bursting
      FileSystemTags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-efs"

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for InfluxDB backup/restore ECS task
      VpcId: !Ref VPC
      SecurityGroupIngress: []  # No inbound access needed for the task
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443 # Enable outbound HTTPS traffic
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: !Ref BackupPort # The port that the backup instance listens on
          ToPort: !Ref BackupPort
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: !Ref RestorePort # The port that the restore instance listens on
          ToPort: !Ref RestorePort
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 2049 # Enable EFS access
          ToPort: 2049
          CidrIp: !GetAtt VPC.CidrBlock

  EFSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for EFS mount targets
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref TaskSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  EFSMountTarget1:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EFSFileSystem
      SubnetId: !Ref PublicSubnet1
      SecurityGroups:
        - !Ref EFSSecurityGroup

  EFSMountTarget2:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EFSFileSystem
      SubnetId: !Ref PublicSubnet2
      SecurityGroups:
        - !Ref EFSSecurityGroup
        
  EFSAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref EFSFileSystem
      PosixUser:
        Uid: 1000
        Gid: 1000
      RootDirectory:
        Path: "/data"
        CreationInfo:
          OwnerUid: 1000
          OwnerGid: 1000
          Permissions: "777"

  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref ECRRepositoryName
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}"
      RetentionInDays: 60

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}-cluster"

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-execution-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-task-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:DeleteObject
                Resource:
                  - !Sub "arn:aws:s3:::${S3BackupBucketName}"
                  - !Sub "arn:aws:s3:::${S3BackupBucketName}/*"
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${TokensSecretName}*"
        - PolicyName: EFSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - elasticfilesystem:ClientMount
                  - elasticfilesystem:ClientWrite
                  - elasticfilesystem:ClientRootAccess
                Resource: 
                  - !GetAtt EFSFileSystem.Arn
                  - !Sub "arn:aws:elasticfilesystem:${AWS::Region}:${AWS::AccountId}:access-point/${EFSAccessPoint}"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DependsOn:
      - EFSMountTarget1
      - EFSMountTarget2
    Properties:
      Family: !Sub "${AWS::StackName}"
      RuntimePlatform:
        CpuArchitecture: "ARM64"
        OperatingSystemFamily: "LINUX"
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: '1024'
      Memory: '2048'
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: !Sub "${AWS::StackName}-container"
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ECRRepositoryName}:latest"
          Essential: true
          User: "1000:1000"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Environment:
            - Name: BACKUP_URL
              Value: !Ref BackupUrl
            - Name: TOKENS_SECRET_NAME
              Value: !Ref TokensSecretName
            - Name: BACKUP_ORG
              Value: !Ref BackupOrg
            - Name: RESTORE_URL
              Value: !Ref RestoreUrl
            - Name: RESTORE_ORG
              Value: !Ref RestoreOrg
            - Name: BUCKET_NAME
              Value: !Ref BucketName
            - Name: S3_BACKUP_BUCKET_NAME
              Value: !Ref S3BackupBucketName
            - Name: EFS_MOUNT_RETRY
              Value: "true"
          MountPoints:
            - SourceVolume: data-volume
              ContainerPath: /data
              ReadOnly: false
      Volumes:
        - Name: data-volume
          EFSVolumeConfiguration:
            FileSystemId: !Ref EFSFileSystem
            RootDirectory: "/"
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref EFSAccessPoint
              IAM: ENABLED

  BackupEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-backup-rule"
      Description: Runs InfluxDB backup ECS task on schedule
      ScheduleExpression: !Ref BackupSchedule
      State: ENABLED
      Targets:
        - Id: BackupTask
          Arn: !GetAtt ECSCluster.Arn
          RoleArn: !GetAtt EventsRole.Arn
          EcsParameters:
            TaskDefinitionArn: !Ref TaskDefinition
            TaskCount: 1
            LaunchType: FARGATE
            NetworkConfiguration:
              AwsVpcConfiguration:
                Subnets:
                  - !Ref PublicSubnet1
                  - !Ref PublicSubnet2
                SecurityGroups:
                  - !Ref TaskSecurityGroup
                AssignPublicIp: ENABLED
          Input: !Sub '{"containerOverrides": [{"name": "${AWS::StackName}-container", "command": ["--operation", "backup"]}]}'

  RestoreEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-restore-rule"
      Description: Runs InfluxDB restore ECS task on schedule
      ScheduleExpression: !Ref RestoreSchedule
      State: ENABLED
      Targets:
        - Id: RestoreTask
          Arn: !GetAtt ECSCluster.Arn
          RoleArn: !GetAtt EventsRole.Arn
          EcsParameters:
            TaskDefinitionArn: !Ref TaskDefinition
            TaskCount: 1
            LaunchType: FARGATE
            NetworkConfiguration:
              AwsVpcConfiguration:
                Subnets:
                  - !Ref PublicSubnet1
                  - !Ref PublicSubnet2
                SecurityGroups:
                  - !Ref TaskSecurityGroup
                AssignPublicIp: ENABLED
          Input: !Sub '{"containerOverrides": [{"name": "${AWS::StackName}-container", "command": ["--operation", "restore", "--force-replace"]}]}'

  EventsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-events-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunECSTaskPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecs:RunTask
                Resource: !Ref TaskDefinition
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt ECSTaskExecutionRole.Arn
                  - !GetAtt TaskRole.Arn
              - Effect: Allow
                Action:
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVpcs
                Resource: "*"

Outputs:
  ClusterName:
    Description: "ECS Cluster Name"
    Value: !Ref ECSCluster
  TaskDefinition:
    Description: "ECS Task Definition ARN"
    Value: !Ref TaskDefinition
  PublicSubnet1:
    Description: "Public Subnet 1 ID"
    Value: !Ref PublicSubnet1
  PublicSubnet2:
    Description: "Public Subnet 2 ID"
    Value: !Ref PublicSubnet2
  TaskSecurityGroup:
    Description: "Security Group ID for ECS Task"
    Value: !Ref TaskSecurityGroup
  ContainerName:
    Description: "Container Name"
    Value: !Sub "${AWS::StackName}-container"
  S3BackupBucket:
    Description: "S3 Bucket for backups"
    Value: !Ref S3BackupBucketName
